name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'                    # Roda se mudar algo na pasta src
      - 'tests/**'                  # Roda se mudar algo na pasta tests
      - 'pages/**'                  # Roda se mudar algo na pasta pages
      - 'fixtures/**'               # Roda se mudar algo na pasta fixtures
      - 'playwright.config.ts'      # Roda se mudar a configuração
      - 'package.json'              # Roda se mudar dependências
      - 'package-lock.json'         # Roda se mudar dependências
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'fixtures/**'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Run Playwright tests
      run: npx playwright test
    
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30